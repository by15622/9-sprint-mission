spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # none에서 update로 변경하세요! (새 테이블 자동 생성)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect # 포스트그레 전용 설정 추가

discodeit:
  storage:
    type: local  # "나는 LocalBinaryContentStorage를 쓰겠다"는 선언이에요.
    local:
      root-path: ./storage  # 파일이 실제로 저장될 폴더 위치예요. (프로젝트 폴더 안에 storage 폴더가 생깁니다)