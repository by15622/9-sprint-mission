spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true # SQL 로그를 보기 좋게 정렬해주는 설정
        dialect: org.hibernate.dialect.PostgreSQLDialect # 포스트그레 전용 설정 추가
  sql:
    init:
      mode: always

  jackson:
    serialization:
      fail-on-empty-beans: false # 가짜 객체(Proxy) 에러를 방지합니다

discodeit:
  storage:
    type: local  # "나는 LocalBinaryContentStorage를 쓰겠다"는 선언이에요.
    local:
      root-path: discodeit/storage  # 파일이 실제로 저장될 폴더 위치예요. (프로젝트 폴더 안에 storage 폴더가 생깁니다)